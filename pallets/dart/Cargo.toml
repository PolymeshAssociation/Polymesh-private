[package]
name = "pallet-dart"
version = "0.1.0"
authors = ["Polymath"]
edition = "2021"

[dependencies]
# Common
polymesh-primitives = { workspace = true, default-features = false }
polymesh-common-utilities = { workspace = true, default-features = false }
polymesh-runtime-common = { workspace = true, default-features = false }

# Our Pallets
pallet-identity = { workspace = true, default-features = false }
pallet-portfolio = { workspace = true, default-features = false }

# Crypto
rand_core = { workspace = true, default-features = false }
rand_chacha = { workspace = true, default-features = false }
polymesh-host-functions = { workspace = true, default-features = false }

# DART
polymesh-dart = { workspace = true, default-features = false, features = [
  "backend_bp",
] }

# Substrate
codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = [
  "derive",
] }
frame-system = { workspace = true, default-features = false }
frame-support = { workspace = true, default-features = false }
sp-std = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }

# Only Benchmarking
frame-benchmarking = { version = "4.0.0-dev", default-features = false, optional = true }

lazy_static = { version = "1.5.0", default-features = false, optional = true }
log = { version = "0.4", default-features = false }

[features]
equalize = []
default = ["std", "equalize"]

testing = ["polymesh-host-functions/runtime-benchmarks"]

asm = [
  "polymesh-dart/asm",
]
parallel = [
  "polymesh-dart/parallel",
]

no_std = ["polymesh-host-functions/no_std", "polymesh-dart/no_std"]
std = [
  "asm",
  "parallel",
  "lazy_static",
  "rand_core/std",
  "rand_chacha/std",
  "codec/std",
  "polymesh-dart/std",
  "frame-support/std",
  "frame-system/std",
  "frame-benchmarking?/std",
  "pallet-identity/std",
  "polymesh-common-utilities/std",
  "polymesh-runtime-common/std",
  "polymesh-primitives/std",
  "polymesh-host-functions/std",
  "sp-runtime/std",
  "sp-std/std",
  "sp-io/std",
]
runtime-benchmarks = [
  "testing",
  "frame-benchmarking/runtime-benchmarks",
  "polymesh-primitives/runtime-benchmarks",
  "polymesh-host-functions/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
]
try-runtime = []
